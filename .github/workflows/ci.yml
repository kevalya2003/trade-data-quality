name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trades
          POSTGRES_PASSWORD: trades
          POSTGRES_DB: trades
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trades -d trades"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TRADEDQ_TEST_DATABASE_URL: postgresql+psycopg://trades:trades@localhost:5432/trades
      TRADEDQ_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      # This project validates the pipeline project's output, so its schema is a real
      # test dependency. Checked out as a sibling rather than vendored, so the tests
      # break if the two schemas drift apart -- which is the point of having them.
      - name: Check out the pipeline project
        uses: actions/checkout@v4
        with:
          repository: kevalya2003/trade-pnl-pipeline
          path: trade-pnl-pipeline

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./trade-pnl-pipeline
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests dags

      - name: Test
        run: pytest -v

      # A DAG that fails to import is a DAG that never runs, and Airflow only tells you
      # at parse time. Importing it in CI catches that before it reaches a scheduler.
      - name: Check the DAG imports
        run: |
          pip install "apache-airflow==3.3.0"
          python -c "
          from airflow.models import DagBag
          bag = DagBag('dags', include_examples=False)
          assert not bag.import_errors, bag.import_errors
          assert 'trade_data_quality' in bag.dags
          print('DAG imported cleanly')
          "
